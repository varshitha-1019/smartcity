<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Smart City">
  <title>Smart City</title>
  <style>
    .scl-building { fill: #1e3a5f; }
    .scl-b3 { fill: #0284c7; }
    .scl-ground { fill: #1e3a5f; opacity: 0.35; }
    .scl-network { stroke: #38bdf8; }
    .scl-node { fill: #facc15; }
    @media (prefers-color-scheme: dark) {
      .scl-building { fill: #e2e8f0; }
      .scl-ground { fill: #e2e8f0; }
      .scl-b3 { fill: #38bdf8; }
    }
  </style>

  <rect x="6" y="30" width="9" height="26" rx="1.5" class="scl-building" />
  <rect x="17" y="20" width="9" height="36" rx="1.5" class="scl-building" />
  <rect x="28" y="8" width="10" height="48" rx="1.5" class="scl-b3" />
  <rect x="40" y="24" width="9" height="32" rx="1.5" class="scl-building" />
  <rect x="51" y="34" width="8" height="22" rx="1.5" class="scl-building" />

  <path d="M10 38 L21 30 L33 18 L44 32 L55 40" class="scl-network" stroke-width="1.4" fill="none" />

  <circle cx="10" cy="38" r="2.2" class="scl-node" />
  <circle cx="21" cy="30" r="2.2" class="scl-node" />
  <circle cx="33" cy="18" r="2.6" class="scl-node" />
  <circle cx="44" cy="32" r="2.2" class="scl-node" />
  <circle cx="55" cy="40" r="2.2" class="scl-node" />

  <rect x="4" y="56" width="56" height="2.5" rx="1.25" class="scl-ground" />
</svg>
